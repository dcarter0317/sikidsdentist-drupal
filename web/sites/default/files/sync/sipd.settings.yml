featured_heading: 'Welcome to Staten Island Pediatric Dentistry'
featured_body_1: "Your child is precious to you, and they are precious to us too. It takes a special group of people to work exclusively with children, and that is exactly what you'll find at Staten Island Pediatric Dentistry."
featured_body_2: "Many of us are parents too, and we know the level of trust required to put your child's care in anyone's hands but your own. Starting with your child's first interaction with our dental team, you will see how devoted we are to their comfort, safety, and well-being."
