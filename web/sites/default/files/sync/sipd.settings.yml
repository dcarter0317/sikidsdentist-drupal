testimonials_heading: 'What Our Patients Say About Us'
testimonials_splide_width: 60vw
testimonials_splide_interval: '15000'
testimonials_cta_text: 'read our testimonials'
testimonials_cta_url: /testimonials
testimonials_slide_1_body: '"My children have always had a positive experience with Dr. Michelle and her staff. Everyone you encounter in the office is friendly and helpful. Dr. Michelle does everything she can to make children feel comfortable and takes time to explain procedures to them in ways they can understand. She also took time with me to explain the best options when I had to make a decision about how to handle my kids'' dental situations. I am very happy with their services and I highly recommend them!"'
testimonials_slide_2_body: '"Every so often you meet someone who has quite simply found their perfect niche in this crazy world. Dr. Michelle is one of those people. She is the best at what she does. My 3 year old is excited to visit the dentist. Michelle makes him feel valued and special and comfortable all while actually getting him to open his mouth and get his teeth cleaned! She remembers him (and me) from one visit to the next and genuinely cares about us as people not just clients. I cannot say enough complimentary things about Dr. Michelle and her practice. They are simply phenomenal and I will recommend them to anyone who will listen!"'
testimonials_slide_3_body: '"Brought my 5 year old daughter here and she absolutely loves It here!! As do i! Amazing staff! Dr Michelle is an absolute gem! My daughter had 2 cavities filled yesterday and they took such amazing care of my daughter she was so comfortable and can''t wait to go back and that means a lot. Thank you so much for taking care of my little girl! If anyone has a child this is the place to go!"'
testimonials_slide_4_body: '"My daughter''s first visit and it was a wonderful experience. Dr Michelle, Veronica and the staff were so thorough working and explaining everything along the way. And before I knew it, my daughter''s loose teeth were both out. This felt like more than just a dental practice, it is an extended family taking care of my daughter. Thank you so much!!!"'
