name: Featured Post
description: "Blog post card with image, eyebrow, title, description, and CTA. Featured variant also shows subtitle, category label, and author."
type: component
group: "Paragraphs Components"

props:
  type: object
  properties:
    eyebrow:
      type: string
      title: "Eyebrow"
      description: "Short text shown above the header — typically the publication date."
    subtitle:
      type: string
      title: "Subtitle"
      description: "Secondary headline (h4). Shown only in featured variant."
    category:
      type: string
      title: "Category"
      description: "Category label displayed below the subtitle. Shown only in featured variant."
    author:
      type: string
      title: "Author"
      description: "Author display name. Shown only in featured variant."
    image:
      type: string
      title: "Image URL"
      description: "URL of the post thumbnail image."
    image_alt:
      type: string
      title: "Image Alt Text"
      description: "Alt text for the post thumbnail."
    title:
      type: string
      title: "Title"
      description: "Main post heading (h3)."
    description:
      type: string
      title: "Description"
      description: "Post excerpt / body copy."
    cta_label:
      type: string
      title: "CTA Label"
      description: "Call-to-action link text (e.g. 'Read More')."
    cta_url:
      type: string
      title: "CTA URL"
      description: "Call-to-action link destination."

variants:
  post_style:
    title: "Post Style"
    description: "Controls whether the subtitle, category, and author header is displayed."
    default: standard
    options:
      standard:
        title: "Standard"
        description: "Title, description, and CTA only."
      featured:
        title: "Featured"
        description: "Adds subtitle, category, and author above the main title."
