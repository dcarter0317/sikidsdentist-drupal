name: Icon Link
description: Icon link block with circular icon and bordered text label.
group: "Paragraphs Components"

props:
  type: object
  properties:
    url:
      type: string
      title: URL
      description: Link destination.
    text:
      type: string
      title: Link text
      description: Text displayed in the block.
    icon_class:
      type: string
      title: Font Awesome icon class
      description: Example fa-solid fa-user-group