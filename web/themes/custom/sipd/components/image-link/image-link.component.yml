name: Image Link
description: A modern, highly visual link component featuring a background image, a brand-colored overlay, and centered typography.
group: "Paragraphs Components"

props:
  type: object
  properties:
    url:
      type: string
      title: URL
      description: Link destination URL.
    text:
      type: string
      title: Text
      description: Text displayed on the block overlay.
    image:
      type: string
      title: Image URL
      description: Background image source URL.
    image_alt:
      type: string
      title: Image Alt Text
      description: Alternative text for accessibility.
    bg_color:
      type: string
      title: Background Color
      description: Overlay background color (hex format).
    bg_opacity:
      type: string
      title: Background Opacity
      description: Overlay background opacity (0 to 1).
