name: Banner
description: "Full-width banner with three style variants: default (title/body/CTA), button-banner (label + two buttons), cta-banner (inline label + single CTA)."
group: "Paragraphs Components"

props:
  type: object
  properties:
    banner_style:
      type: string
      title: "Banner Style"
      default: "default"
    title:
      type: string
      title: "Title"
    body:
      type: string
      title: "Body Text"
    eyebrow:
      type: string
      title: "Eyebrow"
    cta_label:
      type: string
      title: "Primary CTA Label"
    cta_url:
      type: string
      title: "Primary CTA URL"
    cta_secondary_label:
      type: string
      title: "Secondary CTA Label"
    cta_secondary_url:
      type: string
      title: "Secondary CTA URL"
    animation_class:
      type: string
      title: "Animation Class"
      description: "CSS animation class applied to the banner article element."
