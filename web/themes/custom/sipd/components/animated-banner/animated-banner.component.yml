name: Animated Banner
description: "Identical to the Banner component but applies the animation class to the inner content block, so the content animates in while the banner background stays in place. Designed for use with the Paragraphs module."
group: "Paragraphs Components"

props:
  type: object
  required:
    - animation_class
  properties:
    title:
      type: string
      title: "Title"
      description: "Heading text. Used in the 'default' style."
    body:
      type: string
      title: "Body Text"
      description: "Optional supporting copy shown below the title. Used in the 'default' style."
    label:
      type: string
      title: "Label"
      description: "Short introductory text. Used as the category label in 'button-banner' or the prompt text in 'cta-banner'."
    cta_label:
      type: string
      title: "Primary CTA Label"
      description: "Text for the primary call-to-action button."
    cta_url:
      type: string
      title: "Primary CTA URL"
      description: "URL for the primary call-to-action button."
    cta_secondary_label:
      type: string
      title: "Secondary CTA Label"
      description: "Text for the secondary button. Used in 'button-banner' style only."
    cta_secondary_url:
      type: string
      title: "Secondary CTA URL"
      description: "URL for the secondary button. Used in 'button-banner' style only."
    style:
      type: string
      title: "Banner Style"
      description: "Controls the layout and visible elements of the banner."
      default: "default"
      enum:
        - default
        - button-banner
        - cta-banner
    animation_class:
      type: string
      title: "Animation Class"
      description: "CSS animation class from sipd.css. Applied to the inner content block so only the content animates."
      enum:
        - slide-in-left
        - slide-in-content-left
        - slide-in-right
        - slide-in-content-right
        - slide-down
        - slide-down-content
        - slide-up
        - slide-up-content
