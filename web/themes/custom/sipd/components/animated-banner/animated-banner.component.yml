name: Animated Banner
description: "Full-width banner where the animation class is applied to the inner content block, so content animates in while the background stays in place."
group: "Paragraphs Components"

props:
  type: object
  properties:
    banner_style:
      type: string
      title: "Banner Style"
      default: "default"
    title:
      type: string
      title: "Title"
    body:
      type: string
      title: "Body Text"
    eyebrow:
      type: string
      title: "Eyebrow"
    cta_label:
      type: string
      title: "Primary CTA Label"
    cta_url:
      type: string
      title: "Primary CTA URL"
    cta_secondary_label:
      type: string
      title: "Secondary CTA Label"
    cta_secondary_url:
      type: string
      title: "Secondary CTA URL"
    animation_class:
      type: string
      title: "Animation Class"
      description: "CSS animation class applied to .banner__content."
    text_align:
      type: string
      title: "Text Align"
      default: "left"
      description: "Text align for the banner content."
    cta_layout:
      type: string
      title: "CTA Layout"
      default: "row"
      description: "Flex direction for the cta-banner variant: 'row' or 'column'."
