name: Text Block
description: "A simple text block component with an optional title and body content."

# Props define the data contract between Paragraphs and this component.
props:
  type: object
  properties:
    title:
      type: string
      title: "Title"
      description: "Optional title for the text block."
    body:
      type: string
      title: "Body Text"
      description: "The main body content."
    text_align:
      type: string
      title: "Text Align"
      description: "Controls the text alignment of the text block. Maps to field_tb_text_align on the paragraph."
      default: "left"
      enum:
        - left
        - center
        - right
    dark_mode:
      type: boolean
      title: "Dark Mode"
      description: "Whether the component should be rendered in dark mode."
      default: false
    bg_color:
      type: string
      title: "Background Color"
      description: "HEX color code for the background when dark mode is enabled."
    text_color:
      type: string
      title: "Text Color"
      description: "HEX color code for the text when dark mode is enabled."
